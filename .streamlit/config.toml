[theme]
base = "light"
primaryColor = "#14223D"
backgroundColor = "#F4EFE6"
secondaryBackgroundColor = "#EAE2D3"
textColor = "#14223D"
# sans serif, not serif: every custom <div> in app.py (cards, band chip,
# meta lines, risk blocks) inherits this, and the CSS only forces Inter on
# p/li/label. With serif here the report rendered in three type families.
font = "sans serif"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false


